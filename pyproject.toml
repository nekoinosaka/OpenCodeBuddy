[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-buddy"
version = "0.1.45"
description = "Code Buddy bridge for M5Stack StickS3 approvals"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
ble = [
  "bleak>=0.22,<1",
]

[project.scripts]
code-buddy = "opencode_buddy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
opencode_buddy = [
  "native_ble_helper/*.plist",
  "native_ble_helper/*.swift",
  "firmware/*.bin",
  "opencode_plugin/*.js",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
